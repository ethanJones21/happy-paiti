<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cumple – Colaboraciones</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-admin="0">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5"/></symbol>
  <symbol id="i-dot" viewBox="0 0 16 16"><path d="M5 8h6"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Colaboración de cumpleaños</h1>
      <p class="sub">Lo que marcó cada persona, su total y si ya pagó. Se actualiza solo.</p>
    </div>
    <div class="topbtns">
      <button class="btn" id="refreshBtn" type="button" title="Actualizar la tabla">Refrescar</button>
      <button class="btn primary votebtn" id="voteBtn" type="button" hidden>Votar</button>
    </div>
  </header>

  <dialog id="voteDlg">
    <form id="voteForm" method="dialog">
      <h2 id="voteQ"></h2>
      <label class="f">Tu nombre (como aparece en la tabla)
        <input type="text" id="voteName" autocomplete="off" placeholder="Ej. SARA">
      </label>
      <label class="f">Tu correo de Caja Paita
        <input type="email" id="voteEmail" autocomplete="email" placeholder="tucorreo@ejemplo.com">
      </label>
      <p class="voteerr" id="voteMsg" role="alert"></p>
      <div id="voteOpts" class="vopts"></div>
      <div class="vactions">
        <button class="btn" id="voteCancel" type="button">Cancelar</button>
        <button class="btn primary" id="voteSend" type="submit">Enviar voto</button>
      </div>
    </form>
  </dialog>

  <div class="panel tablewrap" id="tw">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
    <div class="empty" id="empty" hidden>Aún no hay personas.</div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
