<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cumple – Panel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-admin="1">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2.5v8M4.8 7.6L8 10.8l3.2-3.2M3 13.5h10"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 10.5v-8M4.8 5.4L8 2.2l3.2 3.2M3 13.5h10"/></symbol>
  <symbol id="i-reset" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v3h3"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5L10.5 8 6 12.5"/></symbol>
  <symbol id="i-dot" viewBox="0 0 16 16"><path d="M5 8h6"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Colaboración de cumpleaños</h1>
      <p class="sub">Marca los productos de cada persona; el precio unitario está en el encabezado. Escribe en <b>Pagó</b> el monto entregado y <b>¿Pagó?</b> se llena solo.</p>
    </div>
    <div class="actions"><span id="status" class="note" role="status" style="align-self:center"></span>
      <button class="btn" id="btnExport"><svg class="ico"><use href="#i-down"/></svg>Exportar</button>
      <button class="btn" id="btnImport"><svg class="ico"><use href="#i-up"/></svg>Importar</button>
      <button class="btn danger" id="btnReset"><svg class="ico"><use href="#i-reset"/></svg>Restablecer</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </header>

  <section class="panel settings" aria-label="Configuración">
    <label class="f">Cumpleañero
      <select id="bday"></select>
    </label>
    <label class="f">Total de la torta
      <input type="number" id="cake" min="0" step="0.01" inputmode="decimal">
    </label>
    <details class="prodbox" id="prodbox">
      <summary><svg class="ico"><use href="#i-chev"/></svg>Productos y precios unitarios</summary>
      <div class="prods" id="prods"></div>
      <div class="prodfoot"><button class="btn" id="addProd"><svg class="ico"><use href="#i-plus"/></svg>Producto</button></div>
    </details>
  </section>

  <section class="panel summary" aria-live="polite">
    <p class="sum-line" id="sumLine"></p>
    <div class="bar" role="progressbar" aria-label="Avance de lo recaudado" id="bar"><i></i></div>
    <p class="facts" id="facts"></p>
  </section>

  <div class="panel tablewrap" id="tw">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
    <div class="empty" id="empty" hidden>Aún no hay personas. Agrega la primera.</div>
  </div>

  <div class="foot">
    <button id="addPerson" class="btn primary"><svg class="ico"><use href="#i-plus"/></svg>Persona</button>
    <p class="note" id="rules"></p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
